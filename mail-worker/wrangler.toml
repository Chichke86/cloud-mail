# Local-only sandbox. Use a separately reviewed config for any real deployment.
name = "wisereply-mail-local"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[dev]
ip = "127.0.0.1"
local_protocol = "https"

[[d1_databases]]
binding = "db"
database_name = "wisereply-local"
database_id = "00000000-0000-4000-8000-000000000001"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000002"

[[r2_buckets]]
binding = "r2"
bucket_name = "wisereply-local"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "ws"
class_name = "MailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailHub"]

[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "73100401"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "API_LIMIT"
namespace_id = "73100402"
simple = { limit = 180, period = 60 }

[observability]
enabled = true
logs = { enabled = true, invocation_logs = false }
traces = { enabled = true, head_sampling_rate = 0.01 }

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["wisereply.example"]
admin = "admin@wisereply.example"
project_link = false
